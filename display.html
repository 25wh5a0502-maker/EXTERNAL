
<!DOCTYPE html>
<html>
<head>
    <title>Display Details</title>
</head>
<body>

    <h2>Registered Student Details</h2>

    <p>Name: <span id="name"></span></p>
    <p>Email: <span id="email"></span></p>
    <p>Phone: <span id="phone"></span></p>

    <script>
        // Get stored JSON data
        var student = JSON.parse(localStorage.getItem("studentData"));

        if (student) {
            document.getElementById("name").innerHTML = student.name;
            document.getElementById("email").innerHTML = student.email;
            document.getElementById("phone").innerHTML = student.phone;
        } else {
            document.body.innerHTML = "<h2>No Registration Details Found</h2>";
        }
    </script>

</body>
</html>
